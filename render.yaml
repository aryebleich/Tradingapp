# Render is a redirect only (since 2026-11-23). Brightolio runs on the Oracle Cloud VM with its own
# database (MIGRATION_ORACLE.md). This service has no database, no keys and runs no jobs: every path
# gets a 301 to the same path on the Oracle server, so old links and bookmarks keep working and
# nothing can run twice. src/render-redirect.js uses only Node.js itself, so nothing is installed.
services:
  - type: web
    name: quantpocket
    runtime: node
    plan: free
    buildCommand: echo "redirect only, nothing to build"
    startCommand: node src/render-redirect.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # The newest Node.js 22 at every build (security fixes).
      - { key: NODE_VERSION, value: "22" }
      - { key: REDIRECT_TO, value: "https://138-2-233-183.sslip.io" }

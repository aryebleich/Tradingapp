# Horizontal Pod Autoscaler: CPU and memory, plus the app's own load ratio and order-queue depth
# when a Prometheus metrics adapter is installed (remove the "Pods"/"External" entries otherwise).
# The predictive scaler raises minReplicas ahead of the open, the close, macro events and VIX spikes.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quantpocket
  namespace: quantpocket
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: quantpocket }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 75 } }
    - type: Pods
      pods:
        metric: { name: qp_load_ratio }
        target: { type: AverageValue, averageValue: "600m" }
    - type: Pods
      pods:
        metric: { name: qp_order_queue_pending }
        target: { type: AverageValue, averageValue: "20" }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
        - { type: Pods, value: 4, periodSeconds: 30 }
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{ type: Percent, value: 25, periodSeconds: 120 }]

# Weekly update pull requests (security fixes included) for npm packages, the Docker base image and
# the GitHub Actions the workflows use. CI and the end-to-end run test each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    # Stay on the Node.js 22 LTS line (patch updates still come); a new major is a deliberate move.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

name: Yiddish Labs translation
# After every push to main, new or changed app and homepage text is translated with Yiddish Labs
# (while the account has credits) and committed back. Admin pages and the README stay in English.
# Needs the repository secret YIDDISH_LABS_API_KEY (Yiddish Labs → API Keys); without it, nothing runs.
on:
  push:
    branches: [main]
    paths: ['public/**', 'scripts/home.py', 'scripts/yi_home.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: yiddish-labs, cancel-in-progress: false }
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - name: Translate new strings
        env:
          YIDDISH_LABS_API_KEY: ${{ secrets.YIDDISH_LABS_API_KEY }}
        run: node scripts/yiddish-labs.mjs translate --new
      - name: Rebuild the Yiddish homepage
        run: python3 scripts/pages.py
      - name: Check the app still loads its dictionary
        run: node -e "import('./public/i18n/yi.js').then(m => console.log(Object.keys(m.strings).length, 'strings'))"
      - name: Commit
        run: |
          if git diff --quiet; then echo "No new translations."; exit 0; fi
          git config user.name "yiddish-labs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/i18n/yi-labs.js scripts/yi_labs.json public/yi.html public/index.html
          git commit -m "Yiddish Labs: translate new strings"
          git push

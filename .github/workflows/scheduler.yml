# A backup clock for the Oracle server, which also runs its own scheduler: every 10 minutes it asks
# the server to run due jobs (each job claims its slot in the database first, so nothing runs twice),
# plus a daily equity snapshot after the US close. The address is the Oracle server's (APP_URL when it
# is set and is not the old Render address, otherwise https://<ORACLE_HOST with dashes>.sslip.io).
name: App scheduler
on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '15 21 * * 1-5'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run due jobs
        env:
          APP_URL_VAR: ${{ vars.APP_URL }}
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL_VAR:-}"; case "$APP_URL" in ""|*onrender.com*) APP_URL="https://$(echo "${ORACLE_HOST:-138.2.233.183}" | tr . -).sslip.io";; esac
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set; skipping."; exit 0; fi
          q=""; if [ "${{ github.event.schedule }}" = "15 21 * * 1-5" ]; then q="?snapshot=1"; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 -X POST -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/internal/tick$q"

# A backup clock for the Oracle server, which also runs its own scheduler: every 10 minutes it asks
# the server to run due jobs (each job claims its slot in the database first, so nothing runs twice),
# plus a daily equity snapshot after the US close. It calls the Oracle server directly (its own address,
# https://<ORACLE_HOST with dashes>.sslip.io): these are internal calls, not the visitors' address.
name: App scheduler
on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '15 21 * * 1-5'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run due jobs
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # The server itself, directly (its own name, not the visitors' address): these are checks of the server.
          DIRECT="https://$(echo "${ORACLE_HOST:-138.2.233.183}" | tr . -).sslip.io"
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set; skipping."; exit 0; fi
          q=""; if [ "${{ github.event.schedule }}" = "15 21 * * 1-5" ]; then q="?snapshot=1"; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 -X POST -H "Authorization: Bearer $CRON_SECRET" "${DIRECT%/}/internal/tick$q"
          # The visitors' address answers too (a warning only, so a DNS hiccup never stops the jobs).
          curl -fsS -o /dev/null --max-time 90 https://app.brightolio.com/healthz || echo "::warning::app.brightolio.com/healthz did not answer"

name: Oracle database move
# The database on the Oracle server, one step at a time (Actions → Oracle database move → Run
# workflow); the server side is deploy/vm/migrate.sh. Also called by oracle-merge-scheduled.yml.
#   status           health, settings (names only), files, backups
#   aichat-diagnose  the admin AI chat's recent failures and each AI provider probed (key shapes only)
#   address-diagnose  which address the site has and why visitors land elsewhere (read only; names, not secrets)
#   maintenance-on / maintenance-off
#   fresh-db         start on a new database (ids from 10,000,000) when the old one cannot be read
#   pull             copy the old database to the server by sync only (a check; merge-turso does it too)
#   merge-turso      bring the old data in (maintenance, pull, rehearsal, merge, verify; any failure
#                    puts the live database back exactly as it was)
#   final-copy       after the merge: the final encrypted copy (90 days);  clean-old-settings  the
#                    old database settings removed from .env;  finalize  both
#   verify           health, schema, rows, credentials, a paper trade, the order guard
#   activate         make this server the active one
#   point-domain     the main address (input settings, default app.brightolio.com) → this server, through Cloudflare
#   set-env          change settings in the server's .env (values masked; secret values go in the
#                    ORACLE_SET_ENV secret, because workflow inputs are visible in the run's details)
#   backup           one backup now;  restore  put the named backup back (input: backup)
# Needs the variable ORACLE_HOST and the secret ORACLE_SSH_KEY. No secret value is ever printed:
# the server-side script reads its own CRON_SECRET from its .env.
on:
  workflow_call:
    inputs:
      step:
        type: string
        required: true
    outputs:
      report:
        description: 'The pull and merge report (JSON, no secrets)'
        value: ${{ jobs.move.outputs.report }}
  workflow_dispatch:
    inputs:
      step:
        description: 'Which step'
        type: choice
        default: status
        options: [status, render-diagnose, address-diagnose, aichat-diagnose, diagnose-load, deploy-now, repair, maintenance-on, maintenance-off, fresh-db, pull, merge-turso, final-copy, clean-old-settings, finalize, verify, activate, point-domain, set-env, backup, restore]
      settings:
        description: 'set-env only: KEY=value pairs separated by ";" (masked in the log). KEY= removes a key.'
        required: false
        default: ''
      backup:
        description: 'restore only: the backup file name (Admin → Database lists them)'
        required: false
        default: ''
      domain:
        description: 'The server address (empty = <ip>.sslip.io)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  move:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # One step at a time on the server (a called run shares the group with the caller's other steps).
    concurrency:
      group: oracle-server
      cancel-in-progress: false
    outputs:
      report: ${{ steps.report.outputs.report }}
    env:
      HOST: ${{ vars.ORACLE_HOST }}
      STEP: ${{ inputs.step }}
    steps:
      - uses: actions/checkout@v5
      - name: Connect
        env:
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          DOMAIN_IN: ${{ inputs.domain }}
        run: |
          [ -n "$HOST" ] || { echo "::error::Add the ORACLE_HOST repository variable."; exit 1; }
          [ -n "$KEY" ] || { echo "::error::Add the ORACLE_SSH_KEY secret."; exit 1; }
          D="${DOMAIN_IN#https://}"; D="${D%%/*}"; [ -n "$D" ] || D="$(echo "$HOST" | tr . -).sslip.io"
          echo "VM_URL=https://$D" >> "$GITHUB_ENV"; echo "Server: https://$D"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/oracle && chmod 600 ~/.ssh/oracle
          for _ in 1 2 3; do ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 5; done
          ssh -i ~/.ssh/oracle -o BatchMode=yes -o ConnectTimeout=20 ubuntu@"$HOST" 'echo "Connected to $(hostname)"'
          scp -q -i ~/.ssh/oracle deploy/vm/migrate.sh ubuntu@"$HOST":/tmp/migrate.sh
          # shellcheck disable=SC2016 # $HOST and $@ expand when the helper runs
          printf '%s\n' '#!/usr/bin/env bash' 'exec ssh -i ~/.ssh/oracle -o BatchMode=yes ubuntu@"$HOST" sudo bash /tmp/migrate.sh "$@"' > ~/vm && chmod 755 ~/vm
      - name: Deploy in the open
        if: env.STEP == 'deploy-now'
        run: ~/vm deploy-now
      - name: Load diagnosis (no change)
        if: env.STEP == 'diagnose-load'
        run: ~/vm diagnose-load
      - name: AI chat diagnosis (no change)
        if: env.STEP == 'aichat-diagnose'
        run: ~/vm aichat-diagnose
      - name: Render diagnosis on the server (no change)
        if: env.STEP == 'render-diagnose'
        run: ~/vm render-diagnose
      - name: Render and DNS settings in GitHub (names only, no change)
        if: env.STEP == 'render-diagnose'
        run: |
          echo "repository variable APP_URL: ${{ vars.APP_URL }}"
          echo "secret RENDER_API_KEY set: ${{ secrets.RENDER_API_KEY != '' }}"
          echo "secret RENDER_DEPLOY_HOOK set: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}"
          echo "secret RENDER_DEPLOY_HOOK_URL set: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}"
          echo "secret RENDER_SERVICE_ID set: ${{ secrets.RENDER_SERVICE_ID != '' }}"
          echo "secret CLOUDFLARE_API_TOKEN set: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}"
          echo "secret CLOUDFLARE_ZONE_ID set: ${{ secrets.CLOUDFLARE_ZONE_ID != '' }}"
          for d in app.brightolio.com brightolio.com www.brightolio.com; do echo "  $d: A [$(dig +short "$d" A | paste -sd, -)] AAAA [$(dig +short "$d" AAAA | paste -sd, -)] CNAME [$(dig +short "$d" CNAME | paste -sd, -)] NS [$(dig +short "$d" NS | paste -sd, -)]"; done
          echo "  brightolio.com NS: $(dig +short brightolio.com NS | paste -sd, -)"
          curl -sS --max-time 20 https://app.brightolio.com/healthz | head -c 300; echo
      - name: Address diagnosis on the server (no change)
        if: env.STEP == 'address-diagnose'
        run: ~/vm address-diagnose
      - name: Address check from outside (no change)
        if: env.STEP == 'address-diagnose'
        run: |
          echo "repository variable APP_URL: ${{ vars.APP_URL }}"
          echo "secret ORACLE_ENV is set: ${{ secrets.ORACLE_ENV != '' }}"
          for u in "https://138-2-233-183.sslip.io/" "http://138.2.233.183/" "https://app.brightolio.com/healthz" "https://app.brightolio.com/"; do
            echo "--- GET $u"
            curl -sS -o /dev/null -D - --max-time 30 "$u" 2>&1 | grep -iE '^(HTTP|location|server|x-render|cf-ray)' | tr -d '\r' | sed 's/^/  /' || echo "  no answer"
          done
          echo "--- certificate for app.brightolio.com, from outside"
          echo | timeout 20 openssl s_client -connect app.brightolio.com:443 -servername app.brightolio.com 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>&1 | sed 's/^/  /' || echo "  no certificate"
          echo "--- DNS, from outside"
          for d in app.brightolio.com brightolio.com; do echo "  $d: A [$(dig +short "$d" A | paste -sd, -)] CNAME [$(dig +short "$d" CNAME | paste -sd, -)]"; done
      - name: The app back up first (an interrupted deploy)
        if: env.STEP == 'repair'
        run: ~/vm repair
      - name: Newest code on the server
        if: env.STEP != 'status' && env.STEP != 'diagnose-load' && env.STEP != 'deploy-now'
        run: |
          ~/vm prep 2>&1 | tail -8

      - name: Maintenance on
        if: env.STEP == 'maintenance-on'
        run: ~/vm maintenance-on
      - name: Maintenance off
        if: env.STEP == 'maintenance-off'
        run: ~/vm maintenance-off
      - name: Start the server on a new database file
        if: env.STEP == 'fresh-db'
        run: ~/vm fresh-db
      - name: Copy the old database to the server (sync only)
        if: env.STEP == 'pull'
        run: ~/vm pull
      - name: Bring the old data in
        if: env.STEP == 'merge-turso'
        run: ~/vm merge-turso
      - name: After the merge (final copy, old settings removed)
        if: contains(fromJSON('["final-copy","clean-old-settings","finalize"]'), env.STEP)
        run: ~/vm "$STEP"
      - name: Make this the active server
        if: env.STEP == 'activate'
        run: ~/vm activate "$VM_URL" | jq -c . || true
      - name: Point the main address at this server (Cloudflare)
        if: env.STEP == 'point-domain'
        env:
          D: ${{ inputs.settings || 'app.brightolio.com' }}
        run: ~/vm point-domain "$D" "$HOST"
      - name: Change settings in the server's .env
        if: env.STEP == 'set-env'
        env:
          PAIRS: ${{ inputs.settings }}
          FROM_SECRET: ${{ secrets.ORACLE_SET_ENV }}
        run: |
          umask 077
          { printf '%s\n' "$FROM_SECRET"; printf '%s' "$PAIRS" | tr ';' '\n'; } | tr -d '\r' | sed -e 's/^ *//' -e '/^$/d' > set.env
          while IFS= read -r l; do v="${l#*=}"; [ -n "$v" ] && echo "::add-mask::$v"; done < set.env
          [ -s set.env ] || { echo "::error::Nothing to set: fill in 'settings' or the ORACLE_SET_ENV secret."; exit 1; }
          ~/vm set-env < set.env; rm -f set.env
      - name: Backup now
        if: env.STEP == 'backup'
        run: ~/vm backup
      - name: Restore a backup
        if: env.STEP == 'restore'
        env:
          NAME: ${{ inputs.backup }}
        run: |
          [ -n "$NAME" ] || { echo "::error::Give the backup file name (input 'backup')."; exit 1; }
          ~/vm restore "$NAME"

      - name: Verify (health, schema, credentials, a paper trade, the order guard)
        if: contains(fromJSON('["verify","fresh-db","merge-turso","maintenance-off","restore"]'), env.STEP)
        run: |
          echo "--- /healthz/full"; curl -sS --max-time 30 "$VM_URL/healthz/full" | jq -c '{ok, database, problems}' || true
          ~/vm verify > verify.json || true
          jq -c '{ok, host, active, standby, maintenance: .maintenance.on, mergePending, database: {kind: .database.kind, bytes: .database.bytes, tables: .database.tables}, schema, credentials, users, problems}' verify.json
          ok=true
          [ "$(jq -r .ok verify.json)" = true ] || { echo "::error::verify: $(jq -c .problems verify.json)"; ok=false; }
          [ "$(jq -r .active verify.json)" = true ] || echo "::warning::this server is not the active one (step activate)"
          t=$(~/vm check-trade || true)
          if [ "$(jq -r .maintenance.on verify.json)" = true ]; then
            echo "Maintenance is on: the paper trade must be refused. $(echo "$t" | jq -c . 2>/dev/null || echo "$t")"
            echo "$t" | grep -qi 'maintenance' || { echo "::error::maintenance is on but the trade was not refused"; ok=false; }
          else
            echo "paper trade: $(echo "$t" | jq -c . 2>/dev/null || echo "$t")"
            [ "$(echo "$t" | jq -r .ok 2>/dev/null)" = true ] || { echo "::error::the paper trade failed"; ok=false; }
          fi
          $ok || { echo "::error::Verify failed."; exit 1; }
          echo "Verify OK."

      - name: Report
        id: report
        if: always()
        run: |
          r=$(~/vm report 2>/dev/null | head -c 60000 || true)
          if [ -n "$r" ] && echo "$r" | jq -e . >/dev/null 2>&1; then
            echo "report=$(echo "$r" | jq -c .)" >> "$GITHUB_OUTPUT"
            { echo "### Report"; echo '```json'; echo "$r" | jq .; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Status
        if: always()
        run: |
          ~/vm status 2>&1 | sed -E 's/[A-Za-z0-9_-]{40,}/[hidden]/g' || true
          echo "--- public: $(curl -sS --max-time 20 "$VM_URL/healthz" || echo 'no answer')"
          # The main address: where its DNS points, and who answers it (this server, Render, Cloudflare).
          for d in app.brightolio.com brightolio.com; do
            echo "--- $d: DNS $(dig +short "$d" A | paste -sd, -) $(dig +short "$d" CNAME | paste -sd, -) (this server: $HOST)"
            curl -sS -o /dev/null -D - --max-time 20 "https://$d/healthz" 2>&1 | grep -iE '^(HTTP|server|location|x-render|cf-ray|via)' | tr -d '\r' | sed 's/^/    /' || true
          done
          ssh -i ~/.ssh/oracle ubuntu@"$HOST" 'rm -f /tmp/migrate.sh' || true
          rm -f ~/.ssh/oracle ~/vm

name: Edge (Cloudflare Worker)
# Deploys edge/worker.js, the small server on Cloudflare's network in front of the app (fast static
# files, failover between servers, keep-warm). Runs when edge/ changes, or by hand.
# Needs: secret CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, Workers KV Storage:Edit), secret
# EDGE_SECRET (any long random text; the same value as EDGE_SECRET on every server), repository
# variables CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_KV_ID and EDGE_ORIGINS (comma list of the servers'
# https addresses, the active one first). Without the token the workflow does nothing.
on:
  push:
    branches: [main]
    paths: ['edge/**', '.github/workflows/edge.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edge
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Is Cloudflare set up?
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV: ${{ vars.CLOUDFLARE_KV_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$KV" ]; then echo "::notice::Edge not deployed: add the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_KV_ID variables (edge/README.md)."; exit 0; fi
          sed -i "s/KV_ID_FROM_WORKFLOW/$KV/" edge/wrangler.toml
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: Deploy the Worker
        if: steps.ready.outputs.ok == '1'
        uses: cloudflare/wrangler-action@v3
        env:
          EDGE_SECRET: ${{ secrets.EDGE_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: edge
          command: deploy --var ORIGINS:${{ vars.EDGE_ORIGINS }}
          secrets: |
            EDGE_SECRET

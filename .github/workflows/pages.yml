# Publishes the public homepage, pricing and legal pages to GitHub Pages (free).
# One-time setup: Settings > Pages > Source: "GitHub Actions".
# Set the repository variable APP_URL (Settings > Secrets and variables > Actions > Variables)
# to your app's address, e.g. https://quantpocket.onrender.com, so buttons and the demo use it.
name: Deploy homepage to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['public/**', 'src/engine.js', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build static site
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          mkdir -p _site
          cd public
          cp index.html yi.html terms.html privacy.html risk.html contact.html status.html security.html insurance.html trust-page.js 404.html site.css site.js favicon.svg icon-512.png og-brightolio.png hero-brightolio.webp manifest.webmanifest chartstates.js ../_site/
          cp ../src/engine.js ../_site/engine.js
          cp -r fonts ../_site/fonts
          cp -r media ../_site/media
          # The same robots.txt as the app's defaults: AI crawlers blocked, search engines allowed.
          node -e "import('../src/crawlers.js').then(m => process.stdout.write(m.robotsTxt()))" > ../_site/robots.txt
          cd ../_site
          APP="${APP_URL%/}"
          echo "window.QP = { api: '${APP}', standalone: true };" > config.js
          # Absolute URLs for social previews, and an app start URL for the installable icon.
          if [ -n "$APP" ]; then sed -i "s#\"start_url\": \"/app\"#\"start_url\": \"${APP}/app\"#" manifest.webmanifest; fi
          sed -i "s#content=\"og-brightolio.png\"#content=\"https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/og-brightolio.png\"#" *.html
          # Each page already names its original at the site's own address (scripts/pages.py), so this
          # copy never competes with it in search results.
          touch .nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

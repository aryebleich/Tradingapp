name: Render redirect
# Render is only a redirect to the Oracle server (render.yaml, src/render-redirect.js). Run by hand
# after a change to either file: it starts one Render deploy with the RENDER_DEPLOY_HOOK_URL secret
# (never printed) and checks that Render answers every path with a 301 to the same path on Oracle.
# Nothing else in the repository calls Render.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redirect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RENDER_URL: https://quantpocket.onrender.com
      ORACLE_HOST: ${{ vars.ORACLE_HOST }}
    steps:
      - name: Deploy the redirect on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::No RENDER_DEPLOY_HOOK_URL secret: Render deploys by itself on push (Auto-Deploy) or not at all."; exit 0; fi
          curl -fsS -X POST "${HOOK}&ref=${SHA}" -o /dev/null && echo "Render deploy started for ${SHA:0:7}."
      - name: Every path answers 301 to the same path on Oracle
        run: |
          want="https://$(echo "${ORACLE_HOST:-138.2.233.183}" | tr . -).sslip.io"
          for _ in $(seq 1 40); do
            got=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 60 "$RENDER_URL/app?from=render" || true)
            echo "Render: $got"
            if [ "$got" = "301 $want/app?from=render" ]; then
              for p in / /terms /api/auth/me; do echo "  $p: $(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 60 "$RENDER_URL$p")"; done
              echo "OK: Render redirects to $want."; exit 0
            fi
            sleep 30
          done
          echo "::error::Render does not redirect yet (last answer: $got)."; exit 1

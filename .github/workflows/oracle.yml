name: Oracle server setup
# Sets up (or updates the settings of) the Brightolio server on Oracle Cloud over SSH, so nothing
# has to be typed on the server. Run by hand (Actions → Oracle server setup → Run workflow).
# Needs, in Settings → Secrets and variables → Actions:
#   secret   ORACLE_SSH_KEY  the server's private key file, whole (-----BEGIN ... END ... KEY-----)
#   secret   ORACLE_ENV      the site's settings: Admin → Keys → Download .env, whole file
#   variable ORACLE_HOST     the server's public IP (e.g. 129.146.12.34)
# Secrets are never printed. The server gets HOST_ID=oracle; PUBLIC_URL stays as in ORACLE_ENV.
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'full = install + settings + start; settings = settings + restart only; check = report only; diagnose = firewall details'
        default: full
        type: choice
        options: [full, settings, check, diagnose]
      domain:
        description: 'Your own domain for this server (e.g. app.brightfolio.com); empty = <ip>.sslip.io'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: oracle-setup
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HOST: ${{ vars.ORACLE_HOST }}
    steps:
      - name: Check the secrets are there
        env:
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ENVF: ${{ secrets.ORACLE_ENV }}
        run: |
          [ -n "$HOST" ] || { echo "::error::Add the ORACLE_HOST repository variable (the server's public IP)."; exit 1; }
          echo "$HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' || { echo "::error::ORACLE_HOST must be the IPv4 address, e.g. 129.146.12.34"; exit 1; }
          [ -n "$KEY" ] || { echo "::error::Add the ORACLE_SSH_KEY secret (the private key file)."; exit 1; }
          if [ "${{ inputs.step }}" != "check" ]; then [ -n "$ENVF" ] || { echo "::error::Add the ORACLE_ENV secret (Admin → Keys → Download .env)."; exit 1; }; fi
          D="${{ inputs.domain }}"; D="${D#https://}"; D="${D%%/*}"
          if [ -n "$D" ]; then echo "$D" | grep -Eq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$' || { echo "::error::'$D' is not a domain name"; exit 1; }; else D="$(echo "$HOST" | tr . -).sslip.io"; fi
          echo "DOMAIN=$D" >> "$GITHUB_ENV"; echo "Domain: $D"
      - name: Connect
        env:
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/oracle && chmod 600 ~/.ssh/oracle
          ssh-keygen -y -f ~/.ssh/oracle >/dev/null || { echo "::error::ORACLE_SSH_KEY is not a valid private key. Paste the whole file, including the BEGIN and END lines."; exit 1; }
          for i in 1 2 3; do ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 5; done
          ssh -i ~/.ssh/oracle -o BatchMode=yes -o ConnectTimeout=20 ubuntu@"$HOST" 'echo "Connected to $(hostname) (Ubuntu $(lsb_release -rs 2>/dev/null))"' \
            || { echo "::error::Could not log in as ubuntu@$HOST. Check the IP, that port 22 is open in the subnet's security list, and that the key belongs to this server."; exit 1; }
      - name: Are ports 80 and 443 open?
        run: |
          for p in 80 443; do
            if timeout 8 bash -c "</dev/tcp/$HOST/$p" 2>/dev/null; then echo "Port $p: open"; else echo "::warning::Port $p is not reachable yet. Oracle console → the instance's subnet → Default Security List → Add Ingress Rules: source 0.0.0.0/0, TCP, ports 80,443 (HTTPS certificates need port 80)."; fi
          done
      - name: Open ports 80 and 443 in the server's own firewall
        run: |
          ssh -i ~/.ssh/oracle ubuntu@"$HOST" 'for spec in "tcp 80" "tcp 443" "udp 443"; do set -- $spec; while sudo iptables -D INPUT -p $1 --dport $2 -j ACCEPT 2>/dev/null; do :; done; sudo iptables -I INPUT 1 -p $1 --dport $2 -j ACCEPT; done; (command -v netfilter-persistent >/dev/null && sudo netfilter-persistent save >/dev/null 2>&1) || true; echo "Server firewall: 80 and 443 allowed, ahead of the reject rule"; sudo iptables -L INPUT -n --line-numbers | head -8'
      - name: Use the domain for HTTPS
        if: inputs.domain != '' && inputs.step != 'check'
        run: |
          ssh -i ~/.ssh/oracle ubuntu@"$HOST" "S=\$(echo $HOST | tr . -).sslip.io; sudo sed -i \"1s/^.*{\$/$DOMAIN, \$S {/\" /etc/caddy/Caddyfile && sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null && sudo systemctl reload caddy && head -1 /etc/caddy/Caddyfile"
      - name: HTTPS certificate (retry now if missing)
        run: |
          ssh -i ~/.ssh/oracle ubuntu@"$HOST" 'if ! curl -fsS --max-time 10 --resolve '"$DOMAIN"':443:127.0.0.1 https://'"$DOMAIN"'/healthz >/dev/null 2>&1; then echo "No working certificate yet: asking again now"; sudo systemctl restart caddy; sleep 45; fi; echo "--- caddy certificate log"; sudo journalctl -u caddy --since "-10 min" --no-pager | grep -iE "obtain|certificate|acme|error|challenge" | tail -15'
      - name: Diagnose the firewall
        if: inputs.step == 'diagnose'
        run: |
          ssh -i ~/.ssh/oracle ubuntu@"$HOST" 'echo "--- listening"; sudo ss -ltnp | grep -E ":(80|443|3000) " ; echo "--- iptables INPUT"; sudo iptables -L INPUT -n -v --line-numbers | head -30; echo "--- ufw"; sudo ufw status verbose | head -20; echo "--- nftables (first lines)"; sudo nft list ruleset 2>/dev/null | grep -nE "chain|policy|dport|reject|drop" | head -40'
          # Watch on the server while connecting from here: do the packets arrive at all?
          ssh -i ~/.ssh/oracle ubuntu@"$HOST" 'sudo timeout 25 tcpdump -ni any -c 20 "src host '"$(curl -s https://api.ipify.org)"' and (tcp port 443 or tcp port 80)" > /tmp/td.txt 2>&1 &' 
          sleep 4
          for i in 1 2 3; do timeout 5 bash -c "</dev/tcp/$HOST/443" 2>/dev/null && echo "connect 443: open" || echo "connect 443: no answer"; timeout 5 bash -c "</dev/tcp/$HOST/80" 2>/dev/null && echo "connect 80: open" || echo "connect 80: no answer"; done
          sleep 22
          echo "--- packets seen on the server (none = blocked before the server)"
          ssh -i ~/.ssh/oracle ubuntu@"$HOST" 'cat /tmp/td.txt; rm -f /tmp/td.txt'
          echo "--- my address: $(curl -s https://api.ipify.org)"
      - name: Install Brightolio
        if: inputs.step == 'full'
        run: |
          ssh -i ~/.ssh/oracle ubuntu@"$HOST" "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy/vm/setup.sh -o setup.sh && sudo bash setup.sh $DOMAIN ${{ github.repository }}" 2>&1 | tail -40
      - name: Put the settings on the server
        if: inputs.step != 'check'
        env:
          ENVF: ${{ secrets.ORACLE_ENV }}
        run: |
          umask 077
          printf '%s\n' "$ENVF" | tr -d '\r' | grep -Ev '^(NODE_ENV|PORT|HOST_ID|RENDER_[A-Z_]*|HOSTNAME)=' > /tmp/app.env
          { echo "NODE_ENV=production"; echo "PORT=3000"; echo "HOST_ID=oracle"; } >> /tmp/app.env
          # With an own domain, the site's public address is that domain.
          if [ -n "${{ inputs.domain }}" ]; then sed -i '/^PUBLIC_URL=/d' /tmp/app.env; fi
          grep -q '^PUBLIC_URL=' /tmp/app.env || echo "PUBLIC_URL=https://$DOMAIN" >> /tmp/app.env
          echo "Public address: $(grep '^PUBLIC_URL=' /tmp/app.env | cut -d= -f2)"
          for k in DATABASE_URL DATABASE_AUTH_TOKEN ENCRYPTION_KEY; do grep -q "^$k=." /tmp/app.env && echo "$k: present" || echo "::warning::$k is missing from ORACLE_ENV"; done
          scp -q -i ~/.ssh/oracle /tmp/app.env ubuntu@"$HOST":/tmp/app.env
          ssh -i ~/.ssh/oracle ubuntu@"$HOST" 'sudo install -m 600 -o brightfolio -g brightfolio /tmp/app.env /opt/brightfolio/.env && rm -f /tmp/app.env && echo "Settings saved (/opt/brightfolio/.env, readable by the app only)"'
          rm -f /tmp/app.env
      - name: Start the app
        if: inputs.step != 'check'
        run: |
          ssh -i ~/.ssh/oracle ubuntu@"$HOST" 'sudo FORCE=1 brightfolio-update' 2>&1 | tail -30
      - name: Report
        if: always()
        run: |
          ssh -i ~/.ssh/oracle -o ConnectTimeout=20 ubuntu@"$HOST" 'echo "--- containers"; sudo docker ps --format "{{.Names}} {{.Status}}" 2>/dev/null; echo "--- caddy"; systemctl is-active caddy; echo "--- app log (last lines)"; cd /opt/brightfolio 2>/dev/null && sudo docker compose logs --tail 15 app 2>/dev/null | grep -viE "key|secret|token|password" ; echo "--- health on the server"; curl -fsS http://127.0.0.1:3000/healthz || echo "app not answering"' || true
          echo "--- from the internet"
          if ! timeout 8 bash -c "</dev/tcp/$HOST/443" 2>/dev/null; then echo "::error::Port 443 is still blocked before it reaches the server: Oracle's network firewall. Oracle console → Networking → Virtual cloud networks → your network → Subnets → the subnet → Security → the security list → Add Ingress Rules: Source CIDR 0.0.0.0/0, IP Protocol TCP, Destination Port Range 80,443. (If the instance uses a Network Security Group, add the same rule there.)"; exit 1; fi
          for i in 1 2 3 4 5 6; do curl -fsS --max-time 20 "https://$DOMAIN/healthz" && { echo; echo "OK: https://$DOMAIN is up"; break; } || sleep 20; done
          curl -sS --max-time 20 "https://$DOMAIN/healthz/routing" || true
      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/oracle

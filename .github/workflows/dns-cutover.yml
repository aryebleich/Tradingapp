name: DNS cutover to Oracle
# Watches for the DNS change that sends app.brightolio.com straight to the Oracle server (the issue
# labelled "dns-cutover" says exactly which record to set). Every 10 minutes, while that issue is open:
# does app.brightolio.com resolve to ORACLE_HOST (or to Cloudflare in front of it), and does
# https://app.brightolio.com/healthz answer from the Oracle server (host "oracle", no Render header)?
# When it does, it writes the result on the issue and closes it. With no open issue it does nothing.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: dns-cutover
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ORACLE_HOST: ${{ vars.ORACLE_HOST }}
    steps:
      - name: Is the DNS change waiting?
        id: issue
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label dns-cutover --state open --json number --jq '.[0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"
          if [ -z "$n" ]; then echo "No open dns-cutover issue: nothing to watch."; else echo "Watching issue #$n"; fi
      - name: Where does app.brightolio.com go?
        if: steps.issue.outputs.number != ''
        id: check
        run: |
          ip="${ORACLE_HOST:-138.2.233.183}"
          a=$(dig +short app.brightolio.com A | paste -sd, -); c=$(dig +short app.brightolio.com CNAME | paste -sd, -)
          h=$(curl -sS -D - -o /tmp/body --max-time 20 https://app.brightolio.com/healthz 2>&1 | tr -d '\r' || true)
          body=$(head -c 400 /tmp/body 2>/dev/null || true)
          host=$(printf '%s' "$body" | jq -r '.host // empty' 2>/dev/null || true)
          render=$(printf '%s' "$h" | grep -ic '^x-render-origin-server' || true)
          echo "DNS A: [$a] CNAME: [$c] (Oracle: $ip); /healthz host: ${host:-none}; Render header: $render"
          direct=false; case ",$a," in *",$ip,"*) direct=true;; esac
          if [ "$host" = oracle ] && [ "$render" = 0 ] && { $direct || [ -z "$c" ]; }; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else echo "done=false" >> "$GITHUB_OUTPUT"; fi
          { echo "a=$a"; echo "host=${host:-none}"; echo "direct=$direct"; } >> "$GITHUB_OUTPUT"
      - name: Close the issue when the site answers from Oracle
        if: steps.check.outputs.done == 'true'
        run: |
          gh issue comment "${{ steps.issue.outputs.number }}" --repo "$GITHUB_REPOSITORY" --body "app.brightolio.com now answers from the Oracle server (DNS A: ${{ steps.check.outputs.a }}, direct to the server: ${{ steps.check.outputs.direct }}, /healthz host: ${{ steps.check.outputs.host }}, no Render header). The site no longer goes through Render. Next, in the Render dashboard: remove the custom domain app.brightolio.com, then suspend the service quantpocket.

          ---
          _Generated by the DNS cutover workflow._"
          gh issue close "${{ steps.issue.outputs.number }}" --repo "$GITHUB_REPOSITORY" --reason completed

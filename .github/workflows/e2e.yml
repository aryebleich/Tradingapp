# Runs the whole app on GitHub: unit and integration tests, then the server with a mock of
# Alpaca driven by a real Chromium browser (desktop flow, phone flow, phone layout audits).
# Screenshots are attached to each run under "Artifacts".
name: Run app (end-to-end)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit and integration tests
        run: npm test
      - name: Start the app and run it in a browser
        run: npm run e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e-output/
          retention-days: 14

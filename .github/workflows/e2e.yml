# Runs the whole app on GitHub: unit and integration tests, then the server with a mock of
# Alpaca driven by a real Chromium browser (desktop flow, phone flow, phone layout audits), and the
# mobile suite: every page on iPhone and Pixel sizes (360-414 px, landscape 740), light and dark,
# English and Yiddish; it fails on sideways overflow, small tap targets or a second disclaimer.
# Screenshots are attached to each run under "Artifacts".
name: Run app (end-to-end)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit and integration tests
        run: npm test
      - name: Start the app and run it in a browser
        run: npm run e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e-output/
          retention-days: 14
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Every page on phone sizes (screenshots, overflow, tap targets, one disclaimer)
        run: npm run e2e:mobile
      - name: Upload the mobile screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-screenshots
          path: e2e-output/mobile/
          retention-days: 14

name: Deploy
# After every push to main whose checks (CI) pass: the Oracle server builds the new version by itself
# (deploy/vm/update.sh, every 2 minutes); this waits until it serves that commit and checks paper and
# live routing and the database on it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      # The Oracle server deploys itself: every 2 minutes it builds the newest main and switches
      # only when the new version answers (deploy/vm/update.sh). Render is a redirect only.
      # After the new version is live: paper must still go to paper and real money to real money.
      - name: Check paper and live routing on the live site
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # The server itself, directly (its own name, not the visitors' address): these are checks of the server.
          DIRECT="https://$(echo "${ORACLE_HOST:-138.2.233.183}" | tr . -).sslip.io"
          url="${DIRECT%/}/healthz/routing"
          # Wait (up to 20 minutes) for the server to serve this commit, then check it.
          for _ in $(seq 1 40); do
            body=$(curl -fsS --max-time 20 "$url" 2>/dev/null || true)
            commit=$(printf '%s' "$body" | python3 -c "import sys,json;print(json.load(sys.stdin).get('commit') or '')" 2>/dev/null || true)
            if [ -n "$body" ] && { [ -z "$commit" ] || [ "${commit:0:7}" = "${SHA:0:7}" ]; }; then break; fi
            sleep 30
          done
          [ -n "$body" ] || { echo "::error::$url did not answer."; exit 1; }
          printf '%s' "$body" | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          print('Paper practice account:', r['paper']['practiceAccount'])
          print('Alpaca paper orders go to:', r['paper']['alpacaPaper'])
          print('Alpaca real-money orders go to:', r['live']['alpacaLive'])
          print('Live commit:', r.get('commit') or 'unknown')
          if not r['ok']:
              for p in r['problems']: print('::error::' + p)
              sys.exit(1)
          print('OK: paper is paper and live is live.')
          "
      # The rest of the production check (GET /healthz/full): a lasting hosted database and a
      # complete schema. Reported as a warning so a setting the owner changes on the server is never
      # mistaken for a code failure.
      - name: Check the database on the live site
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
        run: |
          # The server itself, directly (its own name, not the visitors' address): these are checks of the server.
          DIRECT="https://$(echo "${ORACLE_HOST:-138.2.233.183}" | tr . -).sslip.io"
          body=$(curl -sS --max-time 30 "${DIRECT%/}/healthz/full" || true)
          [ -n "$body" ] || { echo "::warning::/healthz/full did not answer (the server may still be on an older version)."; exit 0; }
          printf '%s' "$body" | python3 -c "
          import sys, json
          try: r = json.load(sys.stdin)
          except Exception: print('::warning::/healthz/full is not available on the live version yet.'); sys.exit(0)
          d = r.get('database', {})
          print('Database answers:', d.get('reachable'), '| lasting (hosted):', d.get('lasting'), '| schema complete:', d.get('schemaOk'), '| columns checked:', d.get('checkedColumns'))
          for p in r.get('problems', []): print('::warning::' + p)
          if r.get('ok'): print('OK: hosted database, complete schema, correct routing.')
          "
      # The live routing check failed: revert the commit on main at once (a new commit, never a
      # history rewrite), start CI on the revert so it deploys, and open an issue.
      - uses: actions/checkout@v7
        if: failure() && github.event_name == 'workflow_run'
        with: { ref: main, fetch-depth: 20 }
      - name: Revert the commit and open an issue
        if: failure() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then echo "A newer commit is on main; reverting only $SHA."; fi
          if git log -1 --format=%s "$SHA" | grep -q '^Revert '; then echo "Not reverting a revert."; else
            git revert --no-edit -m 1 "$SHA" 2>/dev/null || git revert --no-edit "$SHA"
            git push origin HEAD:main && gh workflow run web-ci.yml --ref main --repo "$GITHUB_REPOSITORY"
          fi
          { echo "The live check after deploying ${SHA:0:7} failed, so the commit was reverted on main."; echo; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Deploy of ${SHA:0:7} failed the live check and was reverted" --body-file body.md

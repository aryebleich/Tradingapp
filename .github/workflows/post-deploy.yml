name: Verify live site
# After every deploy to production: smoke-test the live site, watch it for 15 minutes, and if a check
# keeps failing go back to the version that ran before on the Oracle server (its previous image, over
# SSH: ORACLE_HOST and ORACLE_SSH_KEY). Optional secrets SMOKE_EMAIL and
# SMOKE_PASSWORD: a TEST account (never a customer) so the smoke test can also sign in.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: post-deploy
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_URL_VAR: ${{ vars.APP_URL }}
      ORACLE_HOST: ${{ vars.ORACLE_HOST }}
      SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true
      - name: Wait until the live site serves this commit, then smoke-test it
        run: |
          APP_URL="${APP_URL_VAR:-}"; case "$APP_URL" in ""|*onrender.com*) APP_URL="https://$(echo "${ORACLE_HOST:-138.2.233.183}" | tr . -).sslip.io";; esac
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          for _ in $(seq 1 40); do
            commit=$(curl -fsS --max-time 20 "${APP_URL%/}/healthz/routing" 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('commit') or '')" 2>/dev/null || true)
            if [ -z "$commit" ] || [ "${commit:0:7}" = "${SHA:0:7}" ]; then break; fi
            sleep 30
          done
          node scripts/smoke.mjs "$APP_URL"
      - name: Watch for 15 minutes (a check failing twice in a row counts as a regression)
        run: |
          fails=0; total=0; bad=0
          for i in $(seq 1 15); do
            sleep 60; total=$((total+1))
            if out=$(node scripts/smoke.mjs "$APP_URL" 2>&1); then fails=0; else fails=$((fails+1)); bad=$((bad+1)); echo "minute $i: FAILED"; echo "$out" | grep '✗' || true; fi
            if [ "$fails" -ge 2 ]; then echo "::error::The live site failed its smoke test twice in a row."; exit 1; fi
          done
          echo "Watched $total minutes: $bad failed check(s), none twice in a row."
      - name: Go back to the previous version on the Oracle server
        if: failure()
        run: |
          [ -n "$SSH_KEY" ] || { echo "::error::No ORACLE_SSH_KEY secret: cannot go back automatically."; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/oracle && chmod 600 ~/.ssh/oracle
          ssh-keyscan -T 15 -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "::warning::Going back to the previous version on the server (the release ${SHA:0:7} failed live verification)."
          ssh -i ~/.ssh/oracle -o BatchMode=yes ubuntu@"$ORACLE_HOST" 'cd /opt/brightfolio && sudo docker image inspect brightfolio:previous >/dev/null && sudo docker tag brightfolio:previous brightfolio:latest && sudo docker compose up -d --force-recreate app >/dev/null 2>&1 && echo "previous version started"'
          rm -f ~/.ssh/oracle
          sleep 30
          node scripts/smoke.mjs "$APP_URL" && echo "Back on the previous version; the live site passes its smoke test." || echo "::error::Back on the previous version but the smoke test still fails."
          echo "::error::The release ${SHA:0:7} failed live verification; the server runs the previous version until the next commit. Fix the cause and push again."
          exit 1

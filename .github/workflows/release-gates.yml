name: Release gates
run-name: ${{ inputs.reviewed && 'Release gates (reviewed)' || 'Release gates' }}
# Every push to a short-lived branch (ai/*, chore/*, fix/*, feature/*) runs every gate. When all pass,
# the branch is merged into main automatically (a merge commit, only when the branch already contains
# main's latest commit, so the merged tree is exactly the tree that was tested), main is deployed, and
# the branch is deleted. Gates never get skipped: a failing gate leaves main untouched and the branch open
# for the author to fix. If main moved on, merge main into the branch and push again to rerun the gates.
# Branches of the automatic AI loop (ai/claude-*, ai/codex-*; .github/workflows/ai-loop.yml) are merged
# only after another assistant's cross-review passed: the review starts this workflow again on the
# branch with reviewed=true. Grok's research notes (ai/grok-*) merge after the gates like any branch.
#
# Limits: (1) a branch whose changes touch .github/workflows cannot be merged by this workflow (GitHub
# does not let the built-in token change workflow files); push such a merge to main by hand after the
# gates are green. (2) The merge job needs "Read and write permissions" for workflows (Settings → Actions →
# General) and no branch protection that blocks the Actions bot from pushing to main.
on:
  push:
    branches: ['ai/**', 'chore/**', 'fix/**', 'feature/**']
  workflow_dispatch:
    inputs:
      reviewed: { description: 'The cross-review passed (ai-loop.yml sets this for ai/claude-* and ai/codex-* branches)', type: boolean, default: false }
permissions:
  contents: read
concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Dependencies have no known vulnerabilities
        run: npm audit --omit=dev --audit-level=low
      - name: No secrets in the code
        run: node scripts/secrets-scan.mjs
      - name: Every file parses (lint)
        run: |
          bad=0; for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f" || bad=1; done
          for f in $(git ls-files '*.py'); do python3 -m py_compile "$f" || bad=1; done
          exit $bad
      - name: Clean code and README
        run: npm run clean
      - name: Unit and integration tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end flows (sign-up, sign-in, deposit, orders in the sandbox, withdrawal)
        run: npm run e2e
      - name: Disclosures, figures, controls and accessibility, every page at four widths (test mode)
        run: OUT=e2e-output/gate-test bash test/layout/gate.sh
      - name: The same on a production-mode build (staging)
        run: STAGING=1 OUT=e2e-output/gate-staging bash test/layout/gate.sh
      - name: Browser suites (AI team chat, SMS and voice drawer, planning tools)
        run: npm run aichat:ui && npm run comms:ui && npm run tools:ui
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: |
            e2e-output/gate-test/REPORT.md
            e2e-output/gate-staging/REPORT.md
            e2e-output/*.png
          retention-days: 14
  merge:
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      REVIEWED: ${{ github.event_name == 'workflow_dispatch' && inputs.reviewed }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Merge into main, deploy, delete the branch
        run: |
          git config user.name "release-gates[bot]"; git config user.email "release-gates@users.noreply.github.com"
          case "$BRANCH" in ai/claude-*|ai/codex-*)
            if [ "$REVIEWED" != "true" ]; then echo "::notice::Gates passed. This AI loop branch merges after the cross-review (ai-loop.yml)."; exit 0; fi;;
          esac
          git fetch origin main "$BRANCH"
          [ "$(git rev-parse origin/$BRANCH)" = "$SHA" ] || { echo "::warning::The branch moved after these gates started; the newer push runs its own gates."; exit 0; }
          if git diff --name-only origin/main "$SHA" | grep -q '^\.github/workflows/'; then
            echo "::warning::This branch changes workflow files, which this workflow cannot merge. Gates passed: merge it into main by hand."; exit 0
          fi
          if git merge-base --is-ancestor "$SHA" origin/main; then echo "Already in main."; git push origin --delete "$BRANCH" || true; exit 0; fi
          if ! git merge-base --is-ancestor origin/main "$SHA"; then
            echo "::warning::main has new commits this branch does not contain. Merge main into the branch and push to rerun the gates (the merged tree must be the tested tree)."; exit 0
          fi
          git checkout -B main origin/main
          git merge --no-ff "$SHA" -m "Merge $BRANCH (all release gates passed)" -m "Gates: audit, secrets scan, syntax, clean, unit, end-to-end, page gates (test and production mode), browser suites." 
          git push origin main
          git push origin --delete "$BRANCH" || true
          # A push made with the built-in token does not start other workflows, so start the deploy here.
          gh workflow run deploy.yml --ref main
          echo "Merged $BRANCH into main and started the deploy."

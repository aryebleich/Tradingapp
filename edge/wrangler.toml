# Cloudflare Worker for the Brightfolio edge (edge/worker.js). Deployed by .github/workflows/edge.yml;
# the KV namespace id comes from the CLOUDFLARE_KV_ID repository variable at deploy time.
name = "brightfolio-edge"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "CONFIG"
id = "KV_ID_FROM_WORKFLOW"
